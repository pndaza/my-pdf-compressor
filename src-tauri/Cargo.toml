[package]
name = "my-pdf-compressor"
version = "0.1.0"
edition = "2021"
default-run = "my-pdf-compressor"

[lib]
name = "pdf_compress_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "test-pipeline"
path = "src/bin/test_pipeline.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = { version = "0.41", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
fax = "0.2"
base64 = "0.22"
flate2 = "1"
